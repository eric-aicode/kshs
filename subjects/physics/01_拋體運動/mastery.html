    function renderLatexFormulas() {
      if (!window.katex) return;
      document.querySelectorAll('.latex-render:not([data-rendered="true"])').forEach(el => {
        const formula = el.getAttribute('data-formula') || el.textContent;
        const isBlock = el.classList.contains('katex-block');
        try {
          katex.render(formula, el, {
            displayMode: isBlock,
            throwOnError: false
          });
          el.setAttribute('data-rendered', 'true');
        } catch (e) {
          console.warn('KaTeX render error:', e);
        }
      });

      // 同時替換正文內的 $...$ 和 $$...$$
      document.querySelectorAll('.math-text:not([data-rendered="true"])').forEach(el => {
        el.setAttribute('data-rendered', 'true');
        walkTextNodesForMath(el);
      });
    }

    function walkTextNodesForMath(container) {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach(node => {
        const text = node.nodeValue;
        if (!text || (!text.includes('$') && !text.includes('$$'))) return;
        const parent = node.parentNode;
        if (parent && (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE' || parent.classList.contains('katex'))) return;

        const parts = text.split(/(\$\$[\s\S]+?\$\$|\$[^\$\n\r]+?\$)/g);
        if (parts.length <= 1) return;

        const frag = document.createDocumentFragment();
        parts.forEach(part => {
          if (part.startsWith('$$') && part.endsWith('$$')) {
            const math = part.slice(2, -2).trim();
            const span = document.createElement('span');
            try {
              katex.render(math, span, { displayMode: true, throwOnError: false });
              frag.appendChild(span);
            } catch (e) { frag.appendChild(document.createTextNode(part)); }
          } else if (part.startsWith('$') && part.endsWith('$')) {
            const math = part.slice(1, -1).trim();
            const span = document.createElement('span');
            try {
              katex.render(math, span, { displayMode: false, throwOnError: false });
              frag.appendChild(span);
            } catch (e) { frag.appendChild(document.createTextNode(part)); }
          } else if (part) {
            frag.appendChild(document.createTextNode(part));
          }
        });
        parent.replaceChild(frag, node);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 詳解步驟與小題結構化排版引擎
    function formatSolutionHtml(raw) {
      if (!raw) return '<div class="text-paragraph">詳解整理中</div>';
      let str = String(raw).trim();

      // 1. 強迫不同小題或步驟換行（避免題目/詳解中不同小題黏在同一行）
      str = str.replace(/([。；;!?！？\$\)])\s*([（(][0-9一二三四五ABCDE][）\)])/g, '$1\n\n$2');
      str = str.replace(/([。；;!?！？\$\)])\s*(\d+\.\s+)/g, '$1\n\n$2');

      const lines = str.split(/\r?\n/);
      const blocks = [];
      let currentBlock = null;

      const isStepHeader = (line) => {
        const trimmed = line.trim();
        const match = trimmed.match(/^([（(][0-9一二三四五ABCDE][）\)]|\d+\.|\【步驟[0-9一二三四五]+\】|步驟\s*[0-9一二三四五]+[：:.])\s*(.*)$/);
        if (match) {
          return { badge: match[1], rest: match[2] };
        }
        return null;
      };

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        const stepInfo = isStepHeader(trimmed);
        if (stepInfo) {
          if (currentBlock) blocks.push(currentBlock);
          currentBlock = {
            isStep: true,
            badge: stepInfo.badge,
            lines: stepInfo.rest ? [stepInfo.rest] : []
          };
        } else {
          if (!currentBlock) {
            currentBlock = {
              isStep: false,
              lines: [trimmed]
            };
          } else {
            currentBlock.lines.push(trimmed);
          }
        }
      });

      if (currentBlock) blocks.push(currentBlock);

      return blocks.map(block => {
        const formattedContent = formatLinesContent(block.lines);
        if (block.isStep) {
          return `
            <div class="step-card">
              <div class="step-header">
                <span class="step-badge">${escapeHtml(block.badge)}</span>
              </div>
              <div class="step-content">${formattedContent}</div>
            </div>
          `;
        } else {
          return `<div class="text-paragraph">${formattedContent}</div>`;
        }
      }).join('');
    }

    function formatLinesContent(lines) {
      if (!lines || lines.length === 0) return '';
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';

        const safeLine = escapeHtml(trimmed).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        if (/^[-*•]\s+/.test(trimmed)) {
          const bulletText = safeLine.replace(/^[-*•]\s+/, '');
          return `<div class="step-bullet-item"><span class="step-bullet-icon">▸</span><div class="step-bullet-text">${bulletText}</div></div>`;
        }

        return `<div style="margin-bottom:0.25rem;">${safeLine}</div>`;
      }).join('');
    }

    function formatQuestionHtml(raw) {
      if (!raw) return '';
      let str = String(raw).trim();
      str = str.replace(/([。；;!?！？\$\)])\s*([（(][0-9一二三四五ABCDE][）\)])/g, '$1\n$2');
      const lines = str.split(/\r?\n/);
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        const subMatch = trimmed.match(/^([（(][0-9一二三四五ABCDE][）\)])\s*(.*)$/);
        if (subMatch) {
          const badge = escapeHtml(subMatch[1]);
          const rest = escapeHtml(subMatch[2]).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          return `<div class="question-sub-item"><span class="q-sub-badge">${badge}</span><div style="flex:1;">${rest}</div></div>`;
        }
        const safe = escapeHtml(trimmed).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return `<div style="margin-bottom:0.35rem; line-height:1.75;">${safe}</div>`;
      }).join('');
    }

    function formatHintHtml(raw) {
      if (!raw) return '';
      let str = String(raw).trim();
      str = str.replace(/([。；;!?！？\$\)])\s*([（(][0-9一二三四五ABCDE][）\)])/g, '$1\n$2');
      str = str.replace(/([。；;!?！？\$\)])\s*(\d+\.\s+)/g, '$1\n$2');
      const lines = str.split(/\r?\n/);
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        const safe = escapeHtml(trimmed).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        if (/^[-*•]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
          const bulletText = safe.replace(/^[-*•\d.]+\s+/, '');
          return `<div class="step-bullet-item"><span class="step-bullet-icon">💡</span><div class="step-bullet-text">${bulletText}</div></div>`;
        }
        return `<div style="margin-bottom:0.35rem; line-height:1.75;">${safe}</div>`;
      }).join('');
    }

    // ==========================================================================
    // 互動操作事件
    // ==========================================================================
    window.toggleMastered = function(id, isChecked) {
      if (isChecked) {
        masteredSet.add(id);
      } else {
        masteredSet.delete(id);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();

      const row = document.getElementById(`row-q-${id}`);
      if (row) {
        const span = row.querySelector('.q-row-checkbox-label span');
        if (isChecked) {
          row.classList.add('mastered');
          if (span) span.textContent = '已掌握';
        } else {
          row.classList.remove('mastered');
          if (span) span.textContent = '標記精熟';
        }
      }
    };

    window.toggleRowDrawer = function(id) {
      const row = document.getElementById(`row-q-${id}`);
      if (!row) return;
      const isOpen = row.classList.contains('open');
      if (isOpen) {
        row.classList.remove('open');
      } else {
        row.classList.add('open');
        setTimeout(renderLatexFormulas, 30);
      }
    };

    document.getElementById('module-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.pill-tab');
      if (!tab) return;
      document.querySelectorAll('#module-tabs .pill-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilterMod = tab.getAttribute('data-mod');
      renderModules();
    });

    let searchDebounce = null;
    document.getElementById('mastery-search').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        currentSearchText = e.target.value.trim();
        renderModules();
      }, 150);
    });

    document.getElementById('filter-unmastered-only').addEventListener('change', (e) => {
      showUnmasteredOnly = e.target.checked;
      renderModules();
    });

    document.getElementById('btn-toggle-all-details').addEventListener('click', () => {
      allDetailsOpen = !allDetailsOpen;
      document.getElementById('btn-toggle-all-details').textContent = allDetailsOpen ? '📖 全部收合題目' : '📖 全部展開題目';
      document.querySelectorAll('.q-row-item').forEach(item => {
        if (allDetailsOpen) item.classList.add('open');
        else item.classList.remove('open');
      });
      if (allDetailsOpen) setTimeout(renderLatexFormulas, 50);
    });

    document.getElementById('btn-reset-progress').addEventListener('click', () => {
      if (confirm('確定要清空二維拋體所有題目的「已精熟」打勾記錄嗎？')) {
        masteredSet.clear();
        localStorage.removeItem(STORAGE_KEY);
        updateStats();
        renderModules();
      }
    });

    const themeBtn = document.getElementById('theme-toggle-btn');
    const savedTheme = localStorage.getItem('learning_center_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nxt);
      localStorage.setItem('learning_center_theme', nxt);
      themeBtn.textContent = nxt === 'dark' ? '☀️' : '🌙';
    });

    updateStats();
    renderModules();

    let tries = 0;
    const mathTimer = setInterval(() => {
      tries++;
      if (window.katex) {
        clearInterval(mathTimer);
        renderLatexFormulas();
      } else if (tries > 30) {
        clearInterval(mathTimer);
      }
    }, 100);
  </script>
</body>
</html>
