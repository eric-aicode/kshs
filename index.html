<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中物理拋體運動 · 互動解題中心 (1~72題精解)</title>
  <meta name="description" content="專為高中物理打造的拋體運動互動刷題網站。先看題目審題，需要時一鍵展開破題思維與詳細算式推導，字體清晰大方，支援KaTeX數學排版與深色模式。">
  
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- KaTeX for crisp LaTeX Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="core/style.css">
</head>
<body>

  <!-- 頂部導覽列 (Sticky Header) -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo" id="app-logo" aria-hidden="true">⚛️</div>
        <div class="brand-text">
          <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
            <h1 style="font-size:1.15rem; font-weight:800;">高中學習中心</h1>
            <!-- 科目切換選單 -->
            <select class="subject-select" id="subject-select" title="切換學習科目">
              <option value="physics">⚛️ 物理科</option>
              <option value="math">📐 數學科</option>
              <option value="chemistry" disabled>🧪 化學科 (籌備中)</option>
            </select>
            <!-- 單元切換選單 -->
            <select class="unit-select" id="unit-select" title="切換學習單元">
              <option value="01_projectile">🎯 01 二維拋體運動 (1~72題)</option>
              <option value="02_linear_motion">🎯 02 直線運動 (1~19題)</option>
            </select>
          </div>
          <p id="app-subtitle">二維拋體運動 · 第 1 ~ 72 題 全功能互動精解指南</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- 做題模式切換 -->
        <div class="control-pill-group" role="group" aria-label="做題模式切換">
          <button class="pill-btn active" id="mode-focus-btn" title="一次專注一題，適合自行刷題模擬">🎯 單題專注</button>
          <button class="pill-btn" id="mode-list-btn" title="連續滾動瀏覽所有題目與解析">📜 清單連續</button>
        </div>

        <!-- 觀念公式與題型攻略連結 -->
        <a href="guide.html" id="header-guide-link" class="pill-btn guide-link-btn" title="查看公式變形、題型矩陣與解題思考導航" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.45rem; font-weight:800; color:#ffffff; background:linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); border:1px solid rgba(99,102,241,0.5); padding:0.45rem 0.95rem; border-radius:var(--radius-full); box-shadow:0 2px 8px rgba(79,70,229,0.3); transition:all var(--transition-fast);">
          <span>📐</span>
          <span id="header-guide-text">公式題型寶典 (回想自測)</span>
        </a>

        <!-- 圖解自學全書連結 -->
        <a href="subjects/physics/02_直線運動/tutorial.html" id="header-tutorial-link" class="pill-btn" title="查看圖文並茂、由淺入深的自學大師講義" style="text-decoration:none; display:none; align-items:center; gap:0.45rem; font-weight:800; color:#ffffff; background:linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); border:1px solid rgba(14,165,233,0.5); padding:0.45rem 0.95rem; border-radius:var(--radius-full); box-shadow:0 2px 8px rgba(2,132,199,0.3); transition:all var(--transition-fast);">
          <span>📘</span>
          <span id="header-tutorial-text">圖解自學講義</span>
        </a>

        <!-- A4 列印版講義連結 -->
        <a href="guide_print.html" id="header-print-link" class="pill-btn" title="開啟專為 A4 紙張與 PDF 排版優化的雙頁精編講義" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.45rem; font-weight:700; color:#ffffff; background:linear-gradient(135deg, #059669 0%, #10b981 100%); border:1px solid rgba(16,185,129,0.5); padding:0.45rem 0.95rem; border-radius:var(--radius-full); box-shadow:0 2px 8px rgba(5,150,105,0.25); transition:all var(--transition-fast);">
          <span>🖨️</span>
          <span id="header-print-text">A4列印講義 (雙頁)</span>
        </a>

        <!-- 字級縮放控制器 -->
        <div class="font-size-control" title="調節字體大小">
          <button class="font-size-btn" id="font-dec-btn" title="縮小字體" aria-label="縮小字體">A-</button>
          <span class="font-size-indicator" id="font-indicator">115%</span>
          <button class="font-size-btn" id="font-inc-btn" title="放大字體" aria-label="放大字體">A+</button>
        </div>

        <!-- 深淺色主題切換 -->
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="切換深色/淺色主題" aria-label="切換主題">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- 主要版面 (Main Grid Container) -->
  <main class="app-container" id="app-container">
    
    <!-- 側邊欄：單元分類、題號矩陣與搜尋 -->
    <aside class="sidebar-panel">
      <!-- 觀念寶典與列印講義快捷入口 -->
      <div style="background:var(--bg-card); border:1px solid var(--border-light); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; display:flex; flex-direction:column; gap:0.5rem; box-shadow:var(--shadow-sm);">
        <div style="font-size:0.78rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; display:flex; align-items:center; gap:0.35rem;">
          <span>⚡</span><span>必備複習利器</span>
        </div>
        <a href="guide.html" id="sidebar-guide-link" style="text-decoration:none; display:flex; align-items:center; justify-content:space-between; padding:0.55rem 0.75rem; border-radius:var(--radius-sm); background:rgba(79,70,229,0.08); border:1px solid rgba(79,70,229,0.2); color:var(--accent-primary); font-weight:750; font-size:0.88rem; transition:all var(--transition-fast);">
          <span style="display:flex; align-items:center; gap:0.45rem;">
            <span>📐</span><span id="sidebar-guide-text">公式變形與題型寶典</span>
          </span>
          <span style="font-size:0.72rem; background:var(--accent-primary); color:#fff; padding:1px 6px; border-radius:10px;">回想自測</span>
        </a>
        <a href="subjects/physics/02_直線運動/tutorial.html" id="sidebar-tutorial-link" style="text-decoration:none; display:none; align-items:center; justify-content:space-between; padding:0.55rem 0.75rem; border-radius:var(--radius-sm); background:rgba(2,132,199,0.08); border:1px solid rgba(2,132,199,0.25); color:#0284c7; font-weight:750; font-size:0.88rem; transition:all var(--transition-fast);">
          <span style="display:flex; align-items:center; gap:0.45rem;">
            <span>📘</span><span id="sidebar-tutorial-text">圖解自學大師講義</span>
          </span>
          <span style="font-size:0.72rem; background:#0284c7; color:#fff; padding:1px 6px; border-radius:10px;">圖文精解</span>
        </a>
        <a href="guide_print.html" id="sidebar-print-link" style="text-decoration:none; display:flex; align-items:center; justify-content:space-between; padding:0.55rem 0.75rem; border-radius:var(--radius-sm); background:rgba(5,150,105,0.08); border:1px solid rgba(5,150,105,0.2); color:var(--accent-emerald); font-weight:750; font-size:0.88rem; transition:all var(--transition-fast);">
          <span style="display:flex; align-items:center; gap:0.45rem;">
            <span>🖨️</span><span id="sidebar-print-text">A4 雙頁列印講義</span>
          </span>
          <span style="font-size:0.72rem; background:var(--accent-emerald); color:#fff; padding:1px 6px; border-radius:10px;">PDF</span>
        </a>
      </div>

      <!-- 搜尋欄 -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="搜尋題號或題目關鍵字...">
      </div>

      <!-- 分類標籤 (動態生成) -->
      <nav class="filter-tabs" id="filter-tabs-nav" aria-label="單元分類導覽">
        <button class="filter-tab active" data-filter="all">
          <span>全部習題</span>
          <span class="filter-count" id="count-all">72</span>
        </button>
        <button class="filter-tab" data-filter="1-27">
          <span>水平拋體運動 (1~27)</span>
          <span class="filter-count" id="count-1-27">27</span>
        </button>
        <button class="filter-tab" data-filter="28-60">
          <span>斜向拋體運動 (28~60)</span>
          <span class="filter-count" id="count-28-60">33</span>
        </button>
        <button class="filter-tab" data-filter="61-72">
          <span>斜面拋體與相對運動 (61~72)</span>
          <span class="filter-count" id="count-61-72">12</span>
        </button>
        <button class="filter-tab" data-filter="bookmarked">
          <span>⭐ 我的複習標記</span>
          <span class="filter-count" id="count-bookmarked">0</span>
        </button>
      </nav>

      <hr style="border: none; border-top: 1px solid var(--border-light); margin: 0.2rem 0;">

      <!-- 快速題號矩陣 -->
      <div>
        <div class="section-title">
          <span>題號快速跳轉</span>
          <span style="font-size: 0.75rem; text-transform: none; color: var(--text-muted);">點擊直達</span>
        </div>
        <div class="question-grid" id="question-grid" style="margin-top: 0.75rem;">
          <!-- 由 JS 動態生成題號徽章 -->
        </div>
      </div>
    </aside>

    <!-- 題目主展示卡片區 -->
    <section class="main-content" id="main-content">
      <!-- 由 JS 動態插入題目卡片 -->
    </section>

  </main>

  <!-- 底部固定換題操作列 (專注模式下顯示) -->
  <footer class="focus-bottom-nav" id="focus-bottom-nav">
    <button class="nav-btn" id="prev-question-btn">
      <span>←</span> 上一題
    </button>
    <div class="focus-hotkey-hints">
      <span id="current-nav-indicator" style="font-weight: 800; color: var(--text-primary);">第 1 / 72 題</span>
      <span>•</span>
      <span>按 <span class="kbd-badge">Space</span> 快速掀牌解析</span>
      <span>•</span>
      <span>按 <span class="kbd-badge">←</span> <span class="kbd-badge">→</span> 快速換題</span>
    </div>
    <button class="nav-btn" id="next-question-btn">
      下一題 <span>→</span>
    </button>
  </footer>

  <!-- 資料與核心模組腳本 -->
  <script src="core/subjects_config.js"></script>
  <script src="subjects/physics/01_拋體運動/data.js"></script>
  <script src="subjects/physics/02_直線運動/data.js"></script>
  <script src="subjects/math/09_進階三角函數/data.js"></script>
  <script src="core/app.js"></script>
</body>
</html>
